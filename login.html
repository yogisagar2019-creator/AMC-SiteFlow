<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c6b43">

  <title>AMC SiteFlow Login</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    /* =========================
       AMC SITEFLOW LOGIN
    ========================= */

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:24px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          rgba(22,214,107,.18),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(8,124,255,.15),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #071b13,
          #0c6b43 55%,
          #073c29
        );
    }


    #loginScreen{
      width:min(440px,100%);

      padding:38px 36px 34px;

      background:rgba(255,255,255,.97);

      border:1px solid rgba(255,255,255,.55);

      border-radius:22px;

      box-shadow:
        0 25px 70px rgba(0,0,0,.30),
        0 4px 18px rgba(0,0,0,.12);

      text-align:center;

      position:relative;

      overflow:hidden;
    }


    #loginScreen::before{
      content:"";

      position:absolute;

      top:0;
      left:0;

      width:100%;
      height:6px;

      background:
        linear-gradient(
          90deg,
          #0c6b43,
          #16d66b,
          #087cff
        );
    }


    /* AMC LOGO */

    .login-logo{
      width:76px;
      height:76px;

      margin:4px auto 18px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:20px;

      background:
        linear-gradient(
          135deg,
          #0c6b43,
          #16a05d
        );

      color:#ffffff;

      font-size:25px;
      font-weight:900;

      letter-spacing:1px;

      box-shadow:
        0 10px 25px rgba(12,107,67,.28);
    }


    /* MAIN TITLE */

    .login-title{
      margin:0;

      color:#103b2a;

      font-size:34px;

      line-height:1.15;

      font-weight:900;

      letter-spacing:-.7px;
    }


    .login-subtitle{
      margin:8px 0 28px;

      color:#6b7771;

      font-size:14px;

      font-weight:500;
    }


    .login-label{
      display:block;

      margin:0 0 7px;

      text-align:left;

      color:#244136;

      font-size:14px;

      font-weight:700;
    }


    .login-field{
      width:100%;

      height:52px;

      margin:0 0 18px;

      padding:0 15px;

      border:1.5px solid #d8e2dd;

      border-radius:11px;

      background:#f9fbfa;

      color:#17231d;

      font-size:16px;

      outline:none;

      transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }


    .login-field:focus{
      border-color:#0c6b43;

      background:#ffffff;

      box-shadow:
        0 0 0 4px rgba(12,107,67,.10);
    }


    .login-field::placeholder{
      color:#9aa6a0;
    }


    /* LOGIN BUTTON */

    #loginButton.login-btn{
      width:100%;

      height:58px;

      margin-top:5px;

      display:flex;

      align-items:center;
      justify-content:center;

      gap:11px;

      border:0;

      border-radius:12px;

      background:
        linear-gradient(
          135deg,
          #0c6b43,
          #16a05d
        );

      color:#ffffff;

      font-size:18px;

      font-weight:850;

      letter-spacing:.2px;

      cursor:pointer;

      box-shadow:
        0 10px 22px rgba(12,107,67,.25);

      transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;
    }


    #loginButton.login-btn:hover{
      transform:translateY(-2px);

      box-shadow:
        0 14px 28px rgba(12,107,67,.30);

      filter:brightness(1.05);
    }


    #loginButton.login-btn:active{
      transform:translateY(0);
    }


    .login-icon{
      font-size:21px;
      font-weight:900;
    }


    #loginMessage{
      min-height:22px;

      margin:16px 0 0;

      color:#6b7771;

      font-size:14px;

      font-weight:600;
    }


    .login-footer{
      margin-top:22px;

      color:#8a9690;

      font-size:12px;
    }


    @media(max-width:520px){

      body{
        padding:16px;
      }

      #loginScreen{
        padding:32px 22px 28px;

        border-radius:18px;
      }

      .login-title{
        font-size:29px;
      }

      .login-logo{
        width:68px;
        height:68px;
        font-size:22px;
      }

    }

  </style>
</head>


<body>

  <div id="loginScreen">

    <div class="login-logo">
      AMC
    </div>

    <h1 class="login-title">
      AMC SiteFlow
    </h1>

    <p class="login-subtitle">
      Anil Mehta Co. · Construction Management
    </p>


    <label
      class="login-label"
      for="loginEmail"
    >
      Email Address
    </label>

    <input
      id="loginEmail"
      class="login-field"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
    >


    <label
      class="login-label"
      for="loginPassword"
    >
      Password
    </label>

    <input
      id="loginPassword"
      class="login-field"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >


    <button
      id="loginButton"
      class="login-btn"
      type="button"
    >
      <span class="login-icon">➜</span>
      <span>Login</span>
    </button>


    <p id="loginMessage"></p>


    <div class="login-footer">
      Secure access to AMC SiteFlow
    </div>

  </div>


  <script type="module">

    import {
      getAuth,
      signInWithEmailAndPassword
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyDIkkViHYfk6Fci8uNNPSB4VsSrYXx6ZpE",

      authDomain:
        "amc-siteflow.firebaseapp.com",

      projectId:
        "amc-siteflow",

      storageBucket:
        "amc-siteflow.firebasestorage.app",

      messagingSenderId:
        "869621160578",

      appId:
        "1:869621160578:web:ead5365bbd8e084a54329b",

      measurementId:
        "G-7DD9V477L2"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    const loginButton =
      document.querySelector("#loginButton");

    const email =
      document.querySelector("#loginEmail");

    const password =
      document.querySelector("#loginPassword");

    const message =
      document.querySelector("#loginMessage");


    loginButton.addEventListener(
      "click",
      async () => {

        const emailValue =
          email.value.trim();

        const passwordValue =
          password.value;


        if(!emailValue || !passwordValue){

          message.textContent =
            "Email और password दोनों भरें.";

          return;
        }


        message.textContent =
          "Login ho raha hai...";


        try{

          await signInWithEmailAndPassword(
            auth,
            emailValue,
            passwordValue
          );


          message.textContent =
            "Login successful";

          window.location.href =
            "index.html";


        }catch(error){

          console.error(error);

          const messages = {

            "auth/invalid-credential":
              "Email या password गलत है.",

            "auth/user-not-found":
              "यह user account नहीं मिला.",

            "auth/wrong-password":
              "Password गलत है.",

            "auth/invalid-email":
              "Email format सही नहीं है.",

            "auth/too-many-requests":
              "बहुत बार प्रयास हुआ. थोड़ी देर बाद फिर try करें."
          };


          message.textContent =
            messages[error.code] ||
            "Login failed. Email या password check करें.";

        }

      }
    );

  </script>

</body>

</html>
